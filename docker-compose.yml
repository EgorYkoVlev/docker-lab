services:
  frontend:
    image: egoryakovlev2008/egor-website:v1
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    image: containous/whoami
    ports:
      - "8000:80"

  logger:
    image: busybox
    command: sh -c "while true; do date >> /data/log.txt; sleep 5; done"
    volumes:
      - logger-data:/data

volumes:
  logger-data:
